<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多图上传 - 作文拍照识别</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" relstylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }

    .upload-container {
      background: white;
      border-radius: 20px;
      padding: 40px;
      max-width: 900px;
      margin: 0 auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.1);
    }

    .page-title {
      text-align: center;
      color: #333;
      margin-bottom: 30px;
    }

    .page-title i {
      font-size: 3rem;
      color: #667eea;
      margin-bottom: 10px;
      display: block;
    }

    /* 上传区域样式 */
    .upload-area {
      border: 3px dashed #667eea;
      border-radius: 15px;
      padding: 40px 20px;
      text-align: center;
      background: #f8f9ff;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .upload-area:hover {
      border-color: #5a67d8;
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    .upload-area.dragover {
      border-color: #4c51bf;
      background: #e6f3ff;
    }

    .upload-icon {
      font-size: 4rem;
      color: #667eea;
      margin-bottom: 20px;
    }

    .upload-text {
      font-size: 1.2rem;
      color: #666;
      margin-bottom: 10px;
    }

    .upload-hint {
      font-size: 0.9rem;
      color: #999;
    }

    #file-input {
      display: none;
    }

    /* 图片预览网格 */
    .preview-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .preview-item {
      position: relative;
      background: #f8f9fa;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }

    .preview-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .preview-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      display: block;
    }

    .preview-info {
      padding: 10px;
      font-size: 0.85rem;
      color: #666;
      text-align: center;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(220, 53, 69, 0.9);
      color: white;
      border: none;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .preview-item:hover .delete-btn {
      opacity: 1;
    }

    .delete-btn:hover {
      background: #dc3545;
      transform: scale(1.1);
    }

    /* 空状态 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #999;
    }

    .empty-state i {
      font-size: 4rem;
      margin-bottom: 20px;
      opacity: 0.3;
    }

    /* 提示信息 */
    .info-bar {
      background: #e7f3ff;
      border-radius: 10px;
      padding: 15px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .info-text {
      color: #0066cc;
      font-weight: 500;
    }

    .image-count {
      background: #667eea;
      color: white;
      padding: 5px 15px;
      border-radius: 20px;
      font-weight: 600;
    }

    /* 操作按钮 */
    .action-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      margin-top: 30px;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      border: none;
      border-radius: 10px;
      padding: 12px 30px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }

    .btn-outline-primary {
      border: 2px solid #667eea;
      color: #667eea;
      border-radius: 10px;
      padding: 12px 30px;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-outline-primary:hover {
      background: #667eea;
      color: white;
      transform: translateY(-2px);
    }

    /* 错误提示 */
    .error-message {
      background: #f8d7da;
      color: #721c24;
      padding: 12px 20px;
      border-radius: 8px;
      margin: 15px 0;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .error-message.show {
      display: flex;
    }

    /* 加载动画 */
    .loading {
      display: none;
      text-align: center;
      padding: 20px;
    }

    .loading.show {
      display: block;
    }

    .spinner-border {
      width: 3rem;
      height: 3rem;
    }

    /* 响应式 */
    @media (max-width: 768px) {
      .upload-container {
        padding: 20px;
      }

      .preview-grid {
        grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
        gap: 15px;
      }

      .action-buttons {
        flex-direction: column;
      }

      .btn-primary, .btn-outline-primary {
        width: 100%;
      }
    }

    /* 动画效果 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .preview-item {
      animation: fadeIn 0.3s ease;
    }

    /* 成功提示 */
    .success-message {
      background: #d4edda;
      color: #155724;
      padding: 15px 20px;
      border-radius: 10px;
      margin: 20px 0;
      display: none;
      align-items: center;
      gap: 10px;
    }

    .success-message.show {
      display: flex;
    }
  </style>
</head>
<body>
  <div class="upload-container">
    <div class="page-title">
      <i class="bi bi-camera-fill"></i>
      <h1>作文拍照识别</h1>
      <p class="text-muted">上传手写作文图片，我们将智能识别文字内容</p>
    </div>

    <!-- 提示信息 -->
    <div class="info-bar">
      <span class="info-text">
        <i class="bi bi-info-circle me-2"></i>
        支持 JPG、PNG、JPEG 格式，单次最多上传 9 张图片
      </span>
      <span class="image-count">
        <span id="selected-count">0</span> / 9
      </span>
    </div>

    <!-- 错误提示 -->
    <div id="error-message" class="error-message">
      <i class="bi bi-exclamation-circle-fill"></i>
      <span id="error-text"></span>
    </div>

    <!-- 成功提示 -->
    <div id="success-message" class="success-message">
      <i class="bi bi-check-circle-fill"></i>
      <span id="success-text"></span>
    </div>

    <!-- 上传区域 -->
    <div class="upload-area" id="upload-area" onclick="document.getElementById('file-input').click()">
      <i class="bi bi-cloud-upload upload-icon"></i>
      <div class="upload-text">点击或拖拽图片到这里</div>
      <div class="upload-hint">支持多选，按住 Ctrl 键可选择多个文件</div>
      <input type="file" id="file-input" multiple accept="image/jpeg,image/jpg,image/png">
    </div>

    <!-- 图片预览区域 -->
    <div id="preview-section" style="display: none;">
      <h4 class="mt-4 mb-3">
        <i class="bi bi-images me-2"></i>已选择的图片
      </h4>
      <div id="preview-grid" class="preview-grid">
        <!-- 图片预览项将在这里动态生成 -->
      </div>
    </div>

    <!-- 空状态 -->
    <div id="empty-state" class="empty-state">
      <i class="bi bi-image"></i>
      <p>还没有选择任何图片</p>
    </div>

    <!-- 加载动画 -->
    <div id="loading" class="loading">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">处理中...</span>
      </div>
      <p class="mt-3">正在处理图片，请稍候...</p>
    </div>

    <!-- 操作按钮 -->
    <div class="action-buttons" id="action-buttons" style="display: none;">
      <button class="btn btn-outline-primary" onclick="clearAllImages()">
        <i class="bi bi-x-circle me-2"></i>清空重选
      </button>
      <button class="btn btn-primary" onclick="uploadImages()">
        <i class="bi bi-check-circle me-2"></i>开始识别
      </button>
    </div>
  </div>

  <script>
    // 全局变量
    let selectedImages = [];
    const MAX_IMAGES = 9;
    const ALLOWED_TYPES = ['image/jpeg', 'image/jpg', 'image/png'];
    const MAX_FILE_SIZE = 5 * 1024 * 1024; // 5MB

    // DOM 元素
    const fileInput = document.getElementById('file-input');
    const uploadArea = document.getElementById('upload-area');
    const previewSection = document.getElementById('preview-section');
    const previewGrid = document.getElementById('preview-grid');
    const emptyState = document.getElementById('empty-state');
    const selectedCount = document.getElementById('selected-count');
    const actionButtons = document.getElementById('action-buttons');
    const errorMessage = document.getElementById('error-message');
    const errorText = document.getElementById('error-text');
    const successMessage = document.getElementById('success-message');
    const successText = document.getElementById('success-text');
    const loading = document.getElementById('loading');

    // 初始化
    document.addEventListener('DOMContentLoaded', function() {
      // 设置拖拽事件
      setupDragAndDrop();

      // 文件选择事件
      fileInput.addEventListener('change', handleFileSelect);

      // 隐藏空状态
      emptyState.style.display = 'none';
    });

    // 设置拖拽功能
    function setupDragAndDrop() {
      uploadArea.addEventListener('dragover', function(e) {
        e.preventDefault();
        uploadArea.classList.add('dragover');
      });

      uploadArea.addEventListener('dragleave', function(e) {
        e.preventDefault();
        uploadArea.classList.remove('dragover');
      });

      uploadArea.addEventListener('drop', function(e) {
        e.preventDefault();
        uploadArea.classList.remove('dragover');

        const files = Array.from(e.dataTransfer.files);
        handleFiles(files);
      });
    }

    // 处理文件选择
    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      handleFiles(files);
    }

    // 处理文件
    function handleFiles(files) {
      hideError();
      hideSuccess();

      // 过滤出图片文件
      const imageFiles = files.filter(file => ALLOWED_TYPES.includes(file.type));

      if (imageFiles.length === 0) {
        showError('请选择有效的图片文件（JPG、PNG格式）');
        return;
      }

      // 检查文件大小
      const oversizedFiles = imageFiles.filter(file => file.size > MAX_FILE_SIZE);
      if (oversizedFiles.length > 0) {
        showError('有图片文件超过5MB大小限制');
        return;
      }

      // 检查是否超过最大数量
      const remainingSlots = MAX_IMAGES - selectedImages.length;
      const filesToAdd = imageFiles.slice(0, remainingSlots);

      if (imageFiles.length > remainingSlots) {
        showError(`最多只能上传 ${MAX_IMAGES} 张图片，还剩 ${remainingSlots} 个位置`);
      }

      // 添加文件
      filesToAdd.forEach(file => {
        const imageData = {
          id: Date.now() + Math.random(),
          file: file,
          name: file.name,
          size: file.size,
          url: URL.createObjectURL(file)
        };
        selectedImages.push(imageData);
      });

      updatePreview();

      // 清空文件输入，允许重复选择相同文件
      fileInput.value = '';
    }

    // 更新预览
    function updatePreview() {
      selectedCount.textContent = selectedImages.length;

      if (selectedImages.length > 0) {
        emptyState.style.display = 'none';
        previewSection.style.display = 'block';
        actionButtons.style.display = 'flex';

        // 清空并重新生成预览
        previewGrid.innerHTML = '';

        selectedImages.forEach(image => {
          const previewItem = createPreviewItem(image);
          previewGrid.appendChild(previewItem);
        });
      } else {
        emptyState.style.display = 'block';
        previewSection.style.display = 'none';
        actionButtons.style.display = 'none';
      }
    }

    // 创建预览项
    function createPreviewItem(image) {
      const div = document.createElement('div');
      div.className = 'preview-item';
      div.innerHTML = `
        <img src="${image.url}" alt="${image.name}" class="preview-image">
        <div class="preview-info">
          ${formatFileSize(image.size)}
        </div>
        <button class="delete-btn" onclick="deleteImage('${image.id}')">
          <i class="bi bi-x"></i>
        </button>
      `;
      return div;
    }

    // 删除图片
    function deleteImage(imageId) {
      const index = selectedImages.findIndex(img => img.id == imageId);
      if (index > -1) {
        // 释放URL
        URL.revokeObjectURL(selectedImages[index].url);
        selectedImages.splice(index, 1);
        updatePreview();
      }
    }

    // 清空所有图片
    function clearAllImages() {
      if (confirm('确定要清空所有已选的图片吗？')) {
        // 释放所有URL
        selectedImages.forEach(image => {
          URL.revokeObjectURL(image.url);
        });
        selectedImages = [];
        updatePreview();
        hideError();
        hideSuccess();
      }
    }

    // 上传图片（模拟）
    function uploadImages() {
      if (selectedImages.length === 0) {
        showError('请先选择要上传的图片');
        return;
      }

      showLoading();
      hideError();
      hideSuccess();

      // 模拟上传过程
      setTimeout(() => {
        hideLoading();

        // 构建输出数据
        const outputData = {
          images: selectedImages.map(img => ({
            name: img.name,
            size: img.size,
            url: img.url
          })),
          total: selectedImages.length,
          timestamp: new Date().toISOString()
        };

        // 显示成功消息
        showSuccess(`成功上传 ${selectedImages.length} 张图片！`);

        // 在控制台输出结果（实际项目中这里会发送到后端）
        console.log('上传的图片数据：', outputData);

        // 这里可以调用实际的API
        // sendToBackend(outputData);
      }, 2000);
    }

    // 发送到后端（示例）
    function sendToBackend(data) {
      // 实际项目中，这里会使用fetch发送到后端
      /*
      fetch('http://localhost:3003/api/ocr/upload', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
      })
      */
    }

    // 工具函数：格式化文件大小
    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // 显示错误
    function showError(message) {
      errorText.textContent = message;
      errorMessage.classList.add('show');
      setTimeout(() => {
        errorMessage.classList.remove('show');
      }, 5000);
    }

    // 隐藏错误
    function hideError() {
      errorMessage.classList.remove('show');
    }

    // 显示成功
    function showSuccess(message) {
      successText.textContent = message;
      successMessage.classList.add('show');
      setTimeout(() => {
        successMessage.classList.remove('show');
      }, 3000);
    }

    // 隐藏成功
    function hideSuccess() {
      successMessage.classList.remove('show');
    }

    // 显示加载
    function showLoading() {
      loading.classList.add('show');
    }

    // 隐藏加载
    function hideLoading() {
      loading.classList.remove('show');
    }
  </script>
</body>
</html>
