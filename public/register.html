<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册账号 - 小学生作文智能批改背诵平台</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --primary: #536dfe;
      --primary-dark: #4056d6;
      --primary-soft: #eef1ff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #dfe3eb;
      --surface: #ffffff;
      --background: #f3f5ff;
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-width: 320px;
      min-height: 100vh;
      padding: 24px 0;
      overflow-x: hidden;
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }

    .back-link {
      position: fixed;
      top: 20px;
      left: 20px;
      z-index: 5;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: rgba(255, 255, 255, .92);
      font-size: 14px;
      text-decoration: none;
      transition: opacity .2s ease;
    }
    .back-link:hover { color: #fff; opacity: .8; }

    .page-shell {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      min-height: calc(100vh - 48px);
      padding: 20px;
    }

    .register-card {
      width: 440px;
      max-width: 100%;
      padding: 40px 32px;
      overflow: hidden;
      background: var(--surface);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(35, 45, 95, .18);
    }

    .card-header { margin-bottom: 28px; text-align: center; }
    .header-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 56px;
      height: 56px;
      margin-bottom: 14px;
      color: var(--primary);
      font-size: 28px;
      background: var(--primary-soft);
      border-radius: 16px;
    }
    .register-title {
      margin: 0;
      color: var(--text);
      font-size: 26px;
      font-weight: 700;
      letter-spacing: .02em;
    }
    .register-subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .role-selector {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
    }
    .role-option {
      min-width: 0;
      padding: 14px 10px;
      color: #596273;
      text-align: center;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: border-color .2s ease, background .2s ease, color .2s ease;
    }
    .role-option:hover,
    .role-option.active {
      color: var(--primary-dark);
      background: var(--primary-soft);
      border: 2px solid var(--primary);
      padding: 13px 9px;
    }
    .role-option i { display: block; margin-bottom: 6px; font-size: 22px; }
    .role-option h2 { margin: 0; font-size: 15px; font-weight: 600; }

    .form-field { width: 100%; margin-bottom: 16px; }
    .form-label {
      display: block;
      margin-bottom: 7px;
      color: #374151;
      font-size: 14px;
      font-weight: 600;
    }
    .required { color: #ef4444; }
    .form-control {
      display: block;
      width: 100%;
      height: 44px;
      padding: 0 13px;
      color: var(--text);
      font: inherit;
      font-size: 14px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color .2s ease, box-shadow .2s ease;
    }
    select.form-control { cursor: pointer; }
    .form-control::placeholder { color: #a5adba; }
    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(83, 109, 254, .14);
    }

    .grade-class-section { display: none; }
    .grade-class-section.show { display: block; }
    .select-row {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .submit-button {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 44px;
      margin-top: 8px;
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 600;
      background: var(--primary);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
      transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
    }
    .submit-button:hover { background: var(--primary-dark); box-shadow: 0 7px 16px rgba(83, 109, 254, .25); transform: translateY(-1px); }
    .submit-button:disabled { background: #aeb7ca; cursor: not-allowed; transform: none; box-shadow: none; }

    .login-link {
      margin: 22px 0 0;
      color: var(--muted);
      font-size: 14px;
      text-align: center;
    }
    .login-link a { color: var(--primary-dark); font-weight: 600; text-decoration: none; }
    .login-link a:hover { text-decoration: underline; }

    @media (max-width: 768px) {
      body { padding: 16px 0; }
      .back-link { top: 14px; left: 14px; }
      .page-shell { min-height: calc(100vh - 32px); padding: 38px 5vw 20px; }
      .register-card { width: 90%; padding: 32px 24px; }
    }
    @media (max-width: 390px) {
      .register-card { padding: 28px 18px; }
      .role-selector, .select-row { gap: 8px; }
      .role-option { padding-left: 6px; padding-right: 6px; }
      .role-option:hover, .role-option.active { padding-left: 5px; padding-right: 5px; }
    }
  </style>
</head>
<body>
  <a class="back-link" href="index.html"><i class="bi bi-arrow-left"></i><span>返回首页</span></a>

  <main class="page-shell">
    <section class="register-card" aria-labelledby="registerTitle">
      <header class="card-header">
        <div class="header-icon" aria-hidden="true"><i class="bi bi-person-plus-fill"></i></div>
        <h1 class="register-title" id="registerTitle">注册账号</h1>
        <p class="register-subtitle">选择您的角色开始使用</p>
      </header>

      <form id="registerForm" novalidate>
        <div class="role-selector" role="group" aria-label="选择角色">
          <button class="role-option active" type="button" data-role="student" aria-pressed="true">
            <i class="bi bi-person-check" aria-hidden="true"></i><h2>学生</h2>
          </button>
          <button class="role-option" type="button" data-role="teacher" aria-pressed="false">
            <i class="bi bi-person-badge" aria-hidden="true"></i><h2>教师</h2>
          </button>
        </div>
        <input type="hidden" id="role" name="role" value="student">

        <div class="form-field">
          <label class="form-label" for="email">邮箱 <span class="required">*</span></label>
          <input class="form-control" type="email" id="email" name="email" placeholder="请输入邮箱" autocomplete="email" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="username">用户名 <span class="required">*</span></label>
          <input class="form-control" type="text" id="username" name="username" placeholder="请输入用户名" autocomplete="username" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="password">密码 <span class="required">*</span></label>
          <input class="form-control" type="password" id="password" name="password" placeholder="至少6位密码" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="confirmPassword">确认密码 <span class="required">*</span></label>
          <input class="form-control" type="password" id="confirmPassword" name="confirmPassword" placeholder="请再次输入密码" autocomplete="new-password" required>
        </div>
        <div class="form-field">
          <label class="form-label" for="realName">真实姓名 <span class="required">*</span></label>
          <input class="form-control" type="text" id="realName" name="realName" placeholder="请输入真实姓名" required>
        </div>

        <div id="gradeClassSection" class="grade-class-section show">
          <div class="select-row">
            <div class="form-field">
              <label class="form-label" for="grade">年级 <span class="required">*</span></label>
              <select class="form-control" id="grade" name="grade">
                <option value="">请选择年级</option>
                <option value="一年级">一年级</option><option value="二年级">二年级</option>
                <option value="三年级">三年级</option><option value="四年级">四年级</option>
                <option value="五年级">五年级</option><option value="六年级">六年级</option>
              </select>
            </div>
            <div class="form-field">
              <label class="form-label" for="className">班级 <span class="required">*</span></label>
              <select class="form-control" id="className" name="class_name">
                <option value="">请选择班级</option>
                <option value="1班">1班</option><option value="2班">2班</option><option value="3班">3班</option>
                <option value="4班">4班</option><option value="5班">5班</option><option value="6班">6班</option>
                <option value="7班">7班</option><option value="8班">8班</option><option value="9班">9班</option>
                <option value="10班">10班</option><option value="11班">11班</option><option value="12班">12班</option>
                <option value="13班">13班</option><option value="14班">14班</option><option value="15班">15班</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" id="submitBtn" class="submit-button"><i class="bi bi-person-plus me-2"></i>注册</button>
      </form>
      <p class="login-link">已有账号？<a href="parent-login.html">立即登录</a></p>
      <p class="login-link"><a href="feature-center.html?guest=1">先逛逛，访客体验 →</a></p>
    </section>
  </main>

  <script>
    const roleOptions = document.querySelectorAll('.role-option');
    const roleInput = document.getElementById('role');
    const gradeClassSection = document.getElementById('gradeClassSection');
    const gradeInput = document.getElementById('grade');
    const classInput = document.getElementById('className');

    function setRole(role) {
      roleInput.value = role;
      roleOptions.forEach(option => {
        const active = option.dataset.role === role;
        option.classList.toggle('active', active);
        option.setAttribute('aria-pressed', String(active));
      });
      const isStudent = role === 'student';
      gradeClassSection.classList.toggle('show', isStudent);
      gradeInput.required = isStudent;
      classInput.required = isStudent;
      if (!isStudent) { gradeInput.value = ''; classInput.value = ''; }
    }
    roleOptions.forEach(option => option.addEventListener('click', () => setRole(option.dataset.role)));
    setRole('student');

    function validateForm(role) {
      const email = document.getElementById('email').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const realName = document.getElementById('realName').value.trim();
      if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { alert('请输入有效的邮箱地址'); return false; }
      if (!username) { alert('请输入用户名'); return false; }
      if (password.length < 6) { alert('密码至少需要6位'); return false; }
      if (password !== confirmPassword) { alert('两次输入的密码不一致'); return false; }
      if (!realName) { alert('请输入真实姓名'); return false; }
      if (role === 'student' && (!gradeInput.value || !classInput.value)) { alert('请选择年级和班级'); return false; }
      return true;
    }

    const form = document.getElementById('registerForm');
    const submitBtn = document.getElementById('submitBtn');
    form.addEventListener('submit', async event => {
      event.preventDefault();
      const role = roleInput.value;
      if (!validateForm(role)) return;
      const originalText = submitBtn.innerHTML;
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="bi bi-hourglass-split me-2"></i>注册中...';
      try {
        const formData = {
          email: document.getElementById('email').value.trim(),
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
          role
        };
        if (role === 'student') {
          formData.grade = gradeInput.value;
          formData.class_name = classInput.value;
        }
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(formData)
        });
        const data = await response.json();
        if (!response.ok || !data.success) { alert(data.error || '注册失败，请重试'); return; }
        localStorage.setItem('userRole', role);
        localStorage.setItem('userInfo', JSON.stringify(data.user));
        localStorage.setItem('registrationSuccess', 'true');
        if (data.session?.access_token) localStorage.setItem('supabaseAccessToken', data.session.access_token);
        if (data.session?.refresh_token) localStorage.setItem('supabaseRefreshToken', data.session.refresh_token);
        alert(data.requiresEmailConfirmation ? '注册成功，请先完成邮箱验证后登录' : '注册成功！请使用您刚注册的账号登录');
        window.location.href = role === 'student' ? 'parent-login.html' : 'teacher-login.html';
      } catch (error) {
        console.error('注册错误:', error);
        alert('注册失败，请检查网络连接后重试');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = originalText;
      }
    });
  </script>
</body>
</html>
