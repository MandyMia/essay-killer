<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录测试</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    .test { background: #f5f5f5; padding: 15px; border-radius: 8px; margin: 10px 0; }
  </style>
</head>
<body>
  <h1>登录功能测试</h1>

  <div class="test">
    <h3>家长登录测试</h3>
    <button onclick="testParentLogin()">测试家长登录</button>
    <div id="parentResult"></div>
  </div>

  <div class="test">
    <h3>教师登录测试</h3>
    <button onclick="testTeacherLogin()">测试教师登录</button>
    <div id="teacherResult"></div>
  </div>

  <script>
    async function testParentLogin() {
      const result = document.getElementById('parentResult');
      result.innerHTML = '测试中...';

      try {
        const response = await fetch('http://localhost:3003/api/auth/parent/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'testparent001', password: '123456' })
        });

        const data = await response.json();
        result.innerHTML = response.ok ?
          `✅ 成功: ${data.user.id}` :
          `❌ 错误: ${data.error}`;
      } catch (err) {
        result.innerHTML = `❌ 网络错误: ${err.message}`;
      }
    }

    async function testTeacherLogin() {
      const result = document.getElementById('teacherResult');
      result.innerHTML = '测试中...';

      try {
        const response = await fetch('http://localhost:3003/api/auth/teacher/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: 'testteacher001', password: '123456' })
        });

        const data = await response.json();
        result.innerHTML = response.ok ?
          `✅ 成功: ${data.user.id}` :
          `❌ 错误: ${data.error}`;
      } catch (err) {
        result.innerHTML = `❌ 网络错误: ${err.message}`;
      }
    }
  </script>
</body>
</html>
